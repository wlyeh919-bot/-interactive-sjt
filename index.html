<title>互動式 SJT｜五年三班｜PC14 Context-Aware Living Classroom</title>
<style>

*{box-sizing:border-box}

.hidden{display:none!important}
.app-shell{width:min(1500px,100%);margin:auto;padding:12px 14px 24px}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}

  radial-gradient(circle at 74% 63%,rgba(91,68,48,.10) 0 1px,transparent 1.5px),
  radial-gradient(circle at 41% 84%,rgba(255,255,255,.58) 0 1px,transparent 1.4px);background-size:23px 29px,31px 37px,19px 31px}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;background:#efe4cf;filter:saturate(.94) contrast(.995)}
.cut{stroke:var(--line);stroke-width:3.05;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(.6px 1.1px .4px rgba(73,55,40,.10))}
.stage .scene-tag{position:absolute;z-index:15;right:14px;top:14px;display:flex;align-items:center;gap:7px;background:rgba(255,250,241,.9);border:1px solid rgba(106,87,68,.2);border-radius:999px;padding:7px 10px;box-shadow:0 5px 15px rgba(64,47,34,.08);backdrop-filter:blur(8px)}
.scene-tag span{font-size:12px;font-weight:750}.scene-tag small{font-size:10px;color:#88796b}

.teacher-bubble{left:26%;top:31%}.teacher-bubble .tail{left:20%}
.student-bubble{left:61%;top:27%}.student-bubble .tail{right:18%}
.student-bubble.near{left:45%;top:30%}.student-bubble.near .tail{left:55%;right:auto}
.narration-card{position:absolute;z-index:21;left:3.5%;top:6%;width:min(43%,560px);padding:13px 15px 14px;border-radius:15px;background:rgba(255,247,233,.96);border:1px solid rgba(94,72,52,.21);border-left:6px solid rgba(207,129,95,.8);box-shadow:0 10px 24px rgba(61,46,34,.11);font-size:clamp(13px,1.35vw,17px);line-height:1.64;color:#4b4037;opacity:0;transform:translateY(7px);pointer-events:none;transition:.18s ease}
.narration-card.show{opacity:1;transform:none}.narration-card .kicker{font-size:10px;font-weight:850;letter-spacing:.10em;color:#9b6d55;margin-bottom:5px}
.transition-overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(54,47,40,0);opacity:0;pointer-events:none;transition:.35s ease}
.transition-overlay.show{opacity:1;background:rgba(54,47,40,.56);pointer-events:auto}
.transition-card{width:min(76%,620px);padding:26px 28px;border-radius:22px;background:#fff9ef;border:1px solid rgba(83,65,48,.22);box-shadow:0 20px 56px rgba(0,0,0,.22);text-align:center;opacity:0;transform:translateY(12px) scale(.98);transition:.34s ease}
.transition-overlay.show .transition-card{opacity:1;transform:none}.transition-kicker{font-size:11px;font-weight:850;letter-spacing:.14em;color:#a07d61;margin-bottom:7px}.transition-title{font-size:clamp(23px,3vw,38px);font-weight:900;letter-spacing:.04em}.transition-sub{font-size:13px;color:#776a5f;margin-top:8px;line-height:1.55}
.parent-call{position:absolute;z-index:17;right:4%;top:16%;width:min(29%,320px);display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,250,241,.93);border:1px solid rgba(106,85,65,.2);box-shadow:0 10px 24px rgba(68,50,36,.13);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s ease}.parent-call.show{opacity:1;transform:none}.phone-face{width:82px;height:82px;border-radius:50%;background:#ead8bd;display:grid;place-items:center;border:1px solid #cdbb9f}.phone-face svg{width:70px;height:70px}.phone-title{font-size:12px;font-weight:850}.parent-current-line{font-size:12px;line-height:1.5;color:#5f5145;margin-top:5px}.phone-caption{grid-column:1/-1;font-size:10px;color:#8c7a68;padding-top:2px}
.response-dock{margin:10px auto 0;width:100%;border:1px solid rgba(102,82,63,.19);background:rgba(255,251,244,.94);backdrop-filter:blur(9px);border-radius:22px;box-shadow:0 10px 28px rgba(72,55,38,.10);padding:14px 16px 15px;min-height:166px;transition:.25s ease}
.dock-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.dock-title{font-size:18px;font-weight:900;letter-spacing:.01em}.dock-sub{font-size:12px;color:#81766d;line-height:1.5;margin-top:4px}.support-badge{display:inline-flex;align-items:center;gap:5px;background:#e8eee9;color:#48675c;border:1px solid #d3dfd8;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:7px}.input-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:11px}textarea{width:100%;min-height:88px;max-height:180px;resize:vertical;padding:12px 13px;border-radius:15px;border:1px solid #d9cec0;background:#fffefb;color:#352f2b;line-height:1.5;box-shadow:inset 0 1px 1px rgba(0,0,0,.02)}textarea::placeholder{color:#a89e95}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.btn{min-height:44px;border-radius:14px;border:1px solid #d6c8b6;background:#f1e8dc;padding:10px 14px;font-weight:800}.btn.primary{background:linear-gradient(180deg,#c97d60,#b7664d);color:#fff;border-color:#a95e47;box-shadow:0 5px 12px rgba(169,94,71,.18)}.btn.secondary{background:#fffaf2}.btn.ghost{background:transparent}.chip{min-height:39px;border-radius:999px;border:1px solid #d8cbbb;background:#fffaf2;padding:8px 12px;font-size:12px}.mini-row{display:flex;gap:7px;flex-wrap:wrap}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.choice-card{text-align:left;min-height:54px;border:1px solid #d7c9b8;border-radius:14px;background:#fffaf2;padding:10px 11px;line-height:1.42}.choice-card:hover{background:#f5ebdd}.input-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:7px}.input-meta small{font-size:10px;color:#8a7f75}.voice-btn{opacity:.56}.footer-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}.footnote{font-size:10px;color:#91867b;line-height:1.5}.menu{position:relative}.menu-pop{position:absolute;z-index:60;right:0;top:44px;width:210px;padding:8px;background:#fffaf3;border:1px solid #d8cab9;border-radius:16px;box-shadow:var(--shadow)}.menu-pop button{width:100%;text-align:left;background:transparent;border:0;padding:10px;border-radius:10px}.menu-pop button:hover{background:#f2e9dc}.modal{position:fixed;z-index:200;inset:0;display:grid;place-items:center;background:rgba(47,41,36,.55);padding:18px}.modal-card{width:min(760px,100%);max-height:min(80svh,720px);overflow:auto;background:#fffaf2;border-radius:22px;border:1px solid #d8cbbb;box-shadow:0 24px 70px rgba(0,0,0,.25);padding:20px}.modal-card h2{margin:0 0 8px}.modal-card pre{white-space:pre-wrap;font-size:11px;background:#f3ebdf;border-radius:14px;padding:12px;overflow:auto}.results{padding:6px 2px 20px}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.result-card{background:#fffaf2;border:1px solid #ded0c0;border-radius:18px;padding:14px;box-shadow:0 7px 17px rgba(65,48,34,.07)}.result-card h3{margin:0 0 9px;font-size:15px}.score-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{font-size:27px;font-weight:900;color:#355f55}.arrow{color:#a19386}.reason{font-size:12px;line-height:1.55;color:#685c52;margin-top:7px}.trace{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.trace span{font-size:10px;border-radius:999px;padding:4px 7px;background:#ece6dc;color:#6d6157}.result-note{font-size:11px;line-height:1.55;color:#786d63;margin-top:12px;background:#f6efe5;padding:10px 12px;border-radius:13px}
/* --- living classroom motion --- */
.motion-paused *,.motion-paused *::before,.motion-paused *::after{animation-play-state:paused!important}
.actor{transform-box:fill-box;transform-origin:center bottom;will-change:transform}.head,.arm,.tail,.ear{transform-box:fill-box}.teacher-idle{animation:teacherIdle 4.1s ease-in-out infinite}.teacher-head{transform-origin:center bottom;animation:teacherHead 7.4s ease-in-out infinite}.teacher-arm{transform-origin:15% 10%;animation:teacherArm 6.2s ease-in-out infinite}.zian-idle{animation:zianIdle 3.7s ease-in-out infinite}.zian-head{transform-origin:center bottom;animation:zianHead 5.6s ease-in-out infinite}.zian-arm{transform-origin:20% 5%;animation:zianArm 4.7s ease-in-out infinite}.peer-a{animation:peerA 3.9s ease-in-out infinite}.peer-b{animation:peerB 4.5s ease-in-out infinite}.peer-c{animation:peerC 4.2s ease-in-out infinite}.peer-d{animation:peerD 5.1s ease-in-out infinite}.curtain{transform-box:fill-box;transform-origin:center top;animation:curtain 5.8s ease-in-out infinite}.plant{transform-box:fill-box;transform-origin:center bottom;animation:plant 5.3s ease-in-out infinite}.hanging-note{transform-box:fill-box;transform-origin:center top;animation:note 4.6s ease-in-out infinite}.chalk-hand{transform-box:fill-box;transform-origin:12% 12%;animation:chalkIdle 3s ease-in-out infinite}
@keyframes teacherIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes teacherHead{0%,22%,100%{transform:rotate(0)}31%{transform:rotate(2.8deg)}40%{transform:rotate(-2deg)}49%{transform:rotate(0)}}@keyframes teacherArm{0%,100%{transform:rotate(0)}48%{transform:rotate(-4deg)}}
@keyframes zianIdle{0%,100%{transform:translateY(0)}44%{transform:translateY(-3px)}}@keyframes zianHead{0%,27%,100%{transform:rotate(0)}36%{transform:rotate(-4deg)}47%{transform:rotate(2deg)}57%{transform:rotate(0)}}@keyframes zianArm{0%,100%{transform:rotate(0)}42%{transform:rotate(-8deg)}53%{transform:rotate(4deg)}}
@keyframes peerA{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-2px) rotate(-1deg)}68%{transform:rotate(1.3deg)}}@keyframes peerB{0%,100%{transform:translateY(0)}45%{transform:translateY(-2px)}}@keyframes peerC{0%,100%{transform:rotate(0)}38%{transform:rotate(1.4deg)}71%{transform:rotate(-1deg)}}@keyframes peerD{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(1.2deg)}60%{transform:rotate(-1.4deg)}}
@keyframes curtain{0%,100%{transform:skewX(-1deg)}50%{transform:skewX(2.6deg)}}@keyframes plant{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2.2deg)}}@keyframes note{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(1deg)}}@keyframes chalkIdle{0%,100%{transform:rotate(0)}42%{transform:rotate(5deg)}52%{transform:rotate(-3deg)}}
/* positional scene states */
#zianHotspot{transition:transform .75s cubic-bezier(.2,.75,.22,1)}.stage.zian-arrived #zianHotspot{transform:translate(370px,520px)}.stage.zian-arrived .student-bubble{left:29%;top:30%}.stage.behavior-scene #zianHotspot{transform:translate(775px,520px)}.stage.behavior-scene #zian{animation-duration:2.2s}.stage.after-school::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,190,120,.07),rgba(75,72,94,.14))}.stage.phone-scene #world{filter:saturate(.77) brightness(.93)}.stage.phone-scene #teacherHotspot,.stage.phone-scene #zianHotspot,.stage.phone-scene .peer-hotspot{opacity:.22;transition:opacity .3s}.stage.phone-scene #paperPlane,.stage.phone-scene #windowBirdRig{opacity:0!important}
@media (min-width:900px) and (min-height:650px){.stage-wrap{width:min(100%,calc((100svh - 280px) * 12 / 7))}.stage{min-height:0}}
@media(max-width:760px){.app-shell{padding:8px}.local-pill{display:none}.brand strong{font-size:20px}.brand .eyebrow{font-size:9px}.topbar{height:50px}.stage{aspect-ratio:5/4;border-radius:16px}.stage #world{position:absolute;left:50%;top:0;height:100%;width:auto;max-width:none;transform:translateX(-50%)}.scene-tag{top:7px!important;right:7px!important;padding:5px 8px!important}.scene-tag span{font-size:10px}.scene-tag small{font-size:9px}.narration-card{left:3.5%;top:5%;width:72%;font-size:12.5px;padding:10px 11px 11px;border-left-width:4px}.dialogue{max-width:64%;font-size:12.5px;line-height:1.43;padding:8px 10px;border-radius:13px}.teacher-bubble{left:4%;top:39%}.student-bubble{left:39%;top:35%}.student-bubble.near{left:32%;top:37%}.parent-call{right:4%;top:12%;width:72%;grid-template-columns:66px 1fr}.phone-face{width:66px;height:66px}.phone-face svg{width:58px;height:58px}.response-dock{border-radius:16px;padding:12px;min-height:160px}.dock-title{font-size:16px}.input-row{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr}.footer-actions{align-items:flex-start;flex-direction:column}.footnote{font-size:9px}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== PC12 Living Pro: visible first-look motion + persistent context + phone stage ===== */
:root{--glass:rgba(255,250,241,.84);--glass2:rgba(255,250,241,.76);--phone-ink:#314b49}
.stage{isolation:isolate}
.dialogue{background:rgba(255,250,240,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);max-width:min(34%,390px);box-shadow:0 10px 24px rgba(56,43,33,.12)}
.teacher-bubble{left:6.5%;top:55%}.teacher-bubble .tail{left:28%}
.student-bubble{left:48%;top:54%}.student-bubble .tail{right:22%}
.student-bubble.near{left:28%;top:55%}.student-bubble.near .tail{left:30%;right:auto}

#plantHotspot{transform-box:fill-box;transform-origin:center bottom}

.stage.phone-scene #world{opacity:0!important;pointer-events:none!important}
.stage.phone-scene .parent-call{display:none!important}
.call-stage{position:absolute;inset:0;z-index:12;display:none;overflow:hidden;background:linear-gradient(180deg,#dcebdc 0%,#edf0dc 42%,#c9d5b5 43%,#d8c29b 100%)}

.playground{position:absolute;inset:0;opacity:.54;filter:saturate(.72)}
.playground .track{position:absolute;left:-8%;right:-8%;bottom:10%;height:27%;border-radius:50% 50% 0 0/35% 35% 0 0;border-top:10px solid rgba(184,117,82,.22);border-bottom:9px solid rgba(184,117,82,.16)}
