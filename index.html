<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4ef">
<title>互動式 SJT V1.5｜五年二班</title>
<style>
:root{
  --ink:#20302c;--muted:#68736f;--paper:#fffdf8;--glass:rgba(255,255,255,.92);
  --green:#315f55;--green2:#4f8174;--yellow:#f4c861;--line:rgba(37,61,54,.13);
  --shadow:0 18px 50px rgba(35,50,45,.18);--r:26px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe8e3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid rgba(244,200,97,.75);outline-offset:2px}
.hidden{display:none!important}
.app{height:100svh;min-height:100dvh;position:relative;overflow:hidden;background:#edf3ef}
.topbar{
  position:absolute;z-index:80;left:0;right:0;top:0;height:64px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  display:flex;align-items:flex-end;justify-content:space-between;color:white;
  text-shadow:0 2px 8px rgba(0,0,0,.28);pointer-events:none
}
.topbar .title{font-size:14px;font-weight:800;letter-spacing:.01em;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.progress-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.progress-track{width:min(26vw,120px);height:5px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden;flex:0 0 auto}
.progress-bar{height:100%;width:4%;background:var(--yellow);border-radius:999px;transition:width .45s ease}
.top-tools{display:flex;gap:8px;pointer-events:auto}
.tool{
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:rgba(23,38,34,.52);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center
}
.scene{
  position:absolute;inset:0;overflow:hidden;
  background:
    linear-gradient(180deg,#bfe1ed 0 23%,#edf2e4 23% 68%,#d6bb91 68% 100%);
}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,30,27,.05),transparent 18%,transparent 70%,rgba(17,30,27,.14))}
.classroom-bg{position:absolute;inset:0;transition:.55s ease;transform:scale(1.02)}
.board{
  position:absolute;left:5%;top:10%;width:54%;height:30%;border:10px solid #aa8052;border-radius:9px;
  background:linear-gradient(135deg,#2b5a4d,#3e6c5e);box-shadow:0 12px 28px rgba(43,54,49,.18),inset 0 0 0 2px rgba(255,255,255,.08);
  color:#f5f3df;padding:18px 20px
}
.board h3{margin:0 0 10px;font-size:24px}
.board-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font-size:16px;line-height:1.35}
.window{position:absolute;right:5%;top:9%;width:27%;height:31%;border:10px solid #efe8da;background:linear-gradient(#9bd2e4 0 68%,#acd0a1 68%);box-shadow:0 6px 20px rgba(50,65,58,.12)}
.window:before,.window:after{content:"";position:absolute;background:#f3eadb}
.window:before{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%)}
.window:after{top:50%;left:0;right:0;height:6px;transform:translateY(-50%)}
.curtain{position:absolute;top:-7px;width:23%;height:75%;background:#d5b487;opacity:.78}
.curtain.l{left:-5px}.curtain.r{right:-5px}
.desk{position:absolute;width:18%;height:10%;border-radius:10px;background:linear-gradient(#dfbc88,#c99d65);border:3px solid #8e6843;box-shadow:0 6px 0 rgba(83,61,40,.1)}
.d1{left:8%;bottom:17%}.d2{left:31%;bottom:15%}.d3{left:55%;bottom:17%}.d4{left:78%;bottom:15%}
.scene-tag{
  position:absolute;z-index:30;left:16px;top:calc(env(safe-area-inset-top) + 70px);
  background:rgba(28,45,41,.62);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800
}
.time-tag{
  position:absolute;z-index:30;right:16px;top:calc(env(safe-area-inset-top) + 70px);
  background:rgba(28,45,41,.55);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px
}
.character{
  position:absolute;z-index:20;overflow:hidden;border-radius:28px;box-shadow:0 14px 34px rgba(35,50,45,.16);
  border:1px solid rgba(255,255,255,.42);background:#d8e4dc;transition:.5s ease
}
.character img{width:100%;height:100%;object-fit:cover;display:block}
.character.main{width:min(49vw,300px);height:min(34vh,330px);right:3%;bottom:34%}
.character.teacher{width:min(28vw,185px);height:min(19vh,185px);left:3%;bottom:36%}
.character.peer{width:72px;height:92px;border-radius:22px;opacity:.88;box-shadow:0 10px 26px rgba(31,45,40,.12)}
.character.peer.p1{left:11%;bottom:55%}.character.peer.p2{left:31%;bottom:55%}
.character.teacher.focus{width:min(62vw,360px);height:min(42vh,380px);left:50%;right:auto;transform:translateX(-50%);bottom:36%}
.character.sad{width:min(70vw,420px);height:min(31vh,300px);left:50%;right:auto;transform:translateX(-50%);bottom:42%}
.character.parent{width:min(58vw,340px);height:min(31vh,290px);left:50%;right:auto;transform:translateX(-50%);bottom:43%}
.character.hidden-char{opacity:0;transform:translateY(25px) scale(.95);pointer-events:none}
.scene[data-mode="reflect"] .board,.scene[data-mode="reflect"] .window,.scene[data-mode="reflect"] .desk{filter:blur(1.5px);opacity:.55}
.scene[data-mode="days"]{background:linear-gradient(180deg,#cfe4e9 0 23%,#eff1e7 23% 68%,#cfb38a 68%)}
.scene[data-mode="hallway"]{background:linear-gradient(135deg,#e8f0ed,#d7e6e3 58%,#cdbb9f 58%)}
.scene[data-mode="hallway"] .board,.scene[data-mode="hallway"] .window,.scene[data-mode="hallway"] .desk{opacity:0}
.scene[data-mode="phone"]{background:linear-gradient(160deg,#f0cc9a 0 45%,#8c6a4f 45% 100%)}
.scene[data-mode="phone"] .board,.scene[data-mode="phone"] .window,.scene[data-mode="phone"] .desk{opacity:.08}
.caption{
  position:absolute;z-index:45;left:14px;right:14px;bottom:calc(230px + env(safe-area-inset-bottom));
  background:rgba(18,30,27,.88);backdrop-filter:blur(16px);color:white;border:1px solid rgba(255,255,255,.18);
  border-radius:22px;padding:14px 16px;box-shadow:0 14px 35px rgba(20,32,29,.18);transition:.3s ease
}
.caption small{display:block;color:#f3c967;font-weight:800;margin-bottom:5px}
.caption .line{font-size:16px;line-height:1.55}
.caption.compact{bottom:calc(198px + env(safe-area-inset-bottom))}
.dock{
  position:absolute;z-index:55;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);border-radius:26px;
  box-shadow:0 18px 46px rgba(24,38,34,.24);padding:14px;max-height:34svh;overflow:auto;
  transition:transform .28s ease,opacity .28s ease
}
.dock .question{font-weight:850;font-size:16px;margin-bottom:10px}
.dock .sub{color:var(--muted);font-size:13px;line-height:1.45;margin:-4px 0 10px}
textarea{
  width:100%;min-height:80px;max-height:140px;resize:vertical;border-radius:18px;border:1px solid #d9e0dc;
  background:rgba(255,255,255,.92);padding:13px 14px;color:var(--ink);font-size:16px;line-height:1.45
}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px}
.btn{
  border:0;border-radius:16px;padding:12px 16px;min-height:46px;font-weight:800;color:var(--ink);background:#edf1ee
}
.btn.primary{background:var(--yellow);flex:1}
.btn.secondary{background:#e9efec}
.btn.ghost{background:transparent;border:1px solid #d7dfdb}
.mini-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mini-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid #d8dfdc;background:rgba(255,255,255,.8);border-radius:999px;padding:9px 12px;
  font-size:13px;color:#34423e
}
.hint{
  background:#fff7dd;border:1px solid #f0df9c;border-radius:18px;padding:11px 13px;color:#665b3a;font-size:13px;line-height:1.45
}
.confirm{
  border-radius:18px;background:#f4f7f5;border:1px solid #dce3df;padding:12px 13px;font-size:14px;line-height:1.45
}
.support-badge{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:#e9f1ed;color:#315f55;font-weight:800;font-size:12px;margin-bottom:8px
}
.toast{position:absolute;z-index:120;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translateX(-50%) translateY(-10px);
  opacity:0;pointer-events:none;background:rgba(20,31,28,.9);color:#fff;padding:9px 12px;border-radius:999px;font-size:12px;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.menu-pop{
  position:absolute;z-index:110;right:14px;top:calc(env(safe-area-inset-top) + 58px);width:190px;border-radius:18px;padding:8px;
  background:rgba(255,255,255,.96);box-shadow:var(--shadow);border:1px solid #e0e5e2
}
.menu-pop button{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:12px;color:var(--ink)}
.menu-pop button:hover{background:#f1f4f2}
.transition{
  position:absolute;z-index:100;inset:0;display:grid;place-items:center;background:rgba(239,244,240,.94);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:.28s
}
.transition.show{opacity:1;pointer-events:auto}
.transition-card{text-align:center;background:white;border-radius:26px;padding:28px 34px;box-shadow:var(--shadow);max-width:82vw}
.transition-card b{display:block;font-size:24px;margin-bottom:7px}
.results{
  position:absolute;z-index:150;inset:0;background:linear-gradient(180deg,#edf4f0,#fffdf8 38%,#f2eadb);
  overflow:auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 30px)
}
.results h1{font-size:25px;margin:0 0 8px}
.results .lead{color:var(--muted);line-height:1.5;margin-bottom:16px}
.result-card{background:white;border:1px solid #e0e5e2;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 28px rgba(33,47,42,.08)}
.result-card h3{margin:0 0 10px;font-size:17px}
.score-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-size:30px;font-weight:900;color:var(--green)}
.arrow{color:#8b9691}
.reason{margin-top:9px;color:#4e5a56;font-size:14px;line-height:1.55}
.trace{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.trace span{background:#eef3f0;color:#49635b;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:750}
.note{font-size:12px;color:#6e7773;line-height:1.55;background:rgba(255,255,255,.7);border-radius:16px;padding:12px;margin-top:12px}
.result-actions{display:flex;gap:8px;margin-top:16px}
.result-actions .btn{flex:1}
@media (min-width:760px){
  .app{max-width:980px;margin:auto;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
  .dock{left:50%;right:auto;width:min(680px,72%);transform:translateX(-50%);max-height:31svh}
  .caption{left:50%;right:auto;width:min(680px,72%);transform:translateX(-50%)}
  .character.main{right:17%}.character.teacher{left:15%}
}
@media (max-height:690px){
  .caption{bottom:calc(188px + env(safe-area-inset-bottom))}
  .dock{max-height:37svh}
  .character.main{height:36vh;bottom:32%}
}
</style>
</head>

  dock(`<div class="question">你會先怎麼回應子安？</div><div class="sub">先留下你自己的第一個反應，不給提示。</div><div class="actions"><button class="btn primary" id="answer165">直接回應</button></div><div class="mini-row" style="margin-top:8px"><button class="chip" id="lookPeers">看看其他同學</button><button class="chip" id="lookBoard">看黑板資訊</button></div>`);
  $('#lookPeers').onclick=()=>{log('explore','165',{target:'peers'});toast('宥辰說：「哪有，是我們先的啊。」佳恩說：「剛剛真的差不多耶。」')};
  $('#lookBoard').onclick=()=>{log('explore','165',{target:'board'});toast('黑板只留下目前的積分，沒有記錄誰先舉手。')};
  $('#answer165').onclick=()=>askOfficial(165,'initial',(intent,val)=>after165Initial(intent,val));
}
function after165Initial(intent,val){
  setProgress(22);
  if(val===4){return standardized165()}
  setMode('reflect');say('導師內在思考','先不要急著下結論。回到子安剛剛真正不滿的地方。');
  supportPrompt(165,'L1','你剛才已經回應他了。如果要再問一句，你最想先弄清楚哪一部分？',p=>{
    if(p&&p.pred&&score(165,p.pred)===4)return standardized165();
    supportPrompt(165,'L2','再回到他剛才提到的「那一分」本身。你會再確認什麼，才知道爭議到底發生在哪裡？',()=>standardized165());
  });
}
function standardized165(){
  setProgress(31);setMode('classroom');
  standardizedInfo(165,'我不是說一定要把分數改給我們。最後那一題，我們這組先舉手，可是你算給第三組，我是不知道為什麼。',()=>{
    askOfficial(165,'post',()=>after165Post());
  });
}
function after165Post(){
  setProgress(42);say('情境','爭議暫時停住了，但全班還有課要上。');
  dock(`<div class="question">你接下來怎麼讓全班回到學習？</div><div class="mini-row" id="recover">
    <button class="chip" data-r="resume">稍後再處理，先回到複習</button>
    <button class="chip" data-r="rules">簡短說明規則再繼續</button>
    <button class="chip" data-r="individual">暫停積分，改個別練習</button>
    <button class="chip" data-r="switch">結束活動，換下一個安排</button></div>`);
  $('#recover').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.classRecovery=b.dataset.r;log('classroom_recovery',b.dataset.r);transition('同一週，幾天後','事情沒有完全過去',event166)});
}
function event166(){
  setProgress(52);showSad();setTags('五年二班｜數學課','同一週，數日後');
  say('情境','子安今天沒有交作業。上課時，他又一直跟旁邊同學說話。你提醒過一次，他仍把課本闔起來。');
  dock(`<div class="question">你先怎麼跟子安談？</div><div class="sub">先留下你自己的第一個反應。</div><div class="actions"><button class="btn primary" id="answer166">回應子安</button></div>`);
  $('#answer166').onclick=()=>{say('子安','我就是不想弄。那次比賽的事情我到現在還是很煩。');askOfficial(166,'initial',(intent,val)=>after166Initial(intent,val))};
}
function after166Initial(intent,val){
  setProgress(61);
  if(val===4)return standardized166();
  setMode('reflect');say('導師內在思考','他現在談的是作業，但又把話題帶回那次比賽。');
  supportPrompt(166,'L1','除了眼前的作業，他剛剛又提到那次比賽。你還想再了解什麼，或怎麼跟他談？',p=>{
    if(p&&p.pred&&score(166,p.pred)===4)return standardized166();
    supportPrompt(166,'L2','現在同時有兩類訊息：他仍在意先前的事情，也已經出現上課與作業問題。你會怎麼把接下來這段談話說清楚？',()=>standardized166());
  });
}
function standardized166(){
  setProgress(69);showSad();
  standardizedInfo(166,'我這幾天一看到小組積分就很煩，心裡一直在想那天的事。後來上課也不太想管，作業就一直拖著。',()=>{
    askOfficial(166,'post',()=>eventColleague());
  });
}
function eventColleague(){
  transition('下課時間','自然科老師在教室門口叫住你',()=>{
    setProgress(77);setMode('hallway');setTags('教室門口','下課時間');
    say('自然科老師','跟你說一下，子安這兩天在我課堂上也比較容易跟旁邊同學起口角，提醒他的時候有點不耐煩。我想說你這邊是不是也有注意到。');
    dock(`<div class="question">你會怎麼回應科任老師？</div><div class="mini-row" id="colleague">
      <button class="chip" data-c="seek">先問發生時間與情況</button>
      <button class="chip" data-c="compare">比對兩邊觀察</button>
      <button class="chip" data-c="watch">這幾天一起留意</button>
      <button class="chip" data-c="ack">先知道即可</button></div>`);
    $('#colleague').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.colleagueTrace=b.dataset.c;log('colleague_trace',b.dataset.c);transition('放學後','教室慢慢安靜下來',event167)});
  });
}
function event167(){
  setProgress(86);showParent();setTags('與子安家長通話','放學後');
  say('子安家長','老師您好，我是子安的家長。');
  dock(`<div class="question">你會怎麼開始這通電話？</div><div class="sub">這一題正式計分只看第一次切入方式；後面的對話會另外保存為溝通歷程。</div><div class="actions"><button class="btn primary" id="answer167">開始說</button></div>`);
  $('#answer167').onclick=()=>askOfficial(167,'initial',()=>parentTrace1());
}
function parentTrace1(){
  setProgress(92);showParent();say('子安家長','他這幾天回家確實一直提那次小組比賽，也說自己很在意那個結果。作業我們有提醒，但一提到那件事，他就比較煩。');
  dock(`<div class="question">你接下來最想先了解什麼？</div><div class="sub">這段不再計第二個 167 分數，只保留為親師溝通歷程。</div><textarea id="parentQ" maxlength="500" placeholder="你會接著問或說什麼？"></textarea><div class="actions"><button class="btn primary" id="parentSend">繼續對話</button><button class="btn ghost" id="parentHint">我需要一點提示</button></div>`);
  $('#parentHint').onclick=()=>{
    const rec=state.items[167];rec.support_trace.push({level:'FOLLOW-HINT',presented_t_ms:now()-startedAt,prompt:'可以先想：你還缺少哪一段資訊，才能更完整理解孩子在家與學校的狀況？'});
    log('support_presented','167',{level:'FOLLOW-HINT'});
    toast('想想：你還缺少哪一段資訊，才能更完整理解孩子在家與學校的狀況？');
  };
  $('#parentSend').onclick=()=>{
    const t=safeText($('#parentQ').value);if(t.length<4){toast('再多說一點點');return}
    state.communication_trace.push({step:'follow1',raw:t,t_ms:now()-startedAt});log('communication_trace','167',{step:'follow1',length:t.length});
    parentTrace2();
  };
}
function parentTrace2(){
  say('子安家長','在家裡他沒有一直發脾氣，但會反覆提那一分，覺得老師沒有聽他說。這兩天寫作業也比較拖。');
  dock(`<div class="question">聽到家長補充後，你會怎麼收束這通電話？</div><textarea id="parentClose" maxlength="500" placeholder="你接下來會怎麼說？"></textarea><div class="actions"><button class="btn primary" id="finishCall">回應家長</button></div>`);
  $('#finishCall').onclick=()=>{
    const t=safeText($('#parentClose').value);if(t.length<4){toast('再多說一點點');return}
    state.communication_trace.push({step:'follow2',raw:t,t_ms:now()-startedAt});log('communication_trace','167',{step:'follow2',length:t.length});
    transition('這段情境告一段落','看看你一路留下的判斷與支持歷程',finish);
  };
}

function supportLabels(rec){
  const out=['L0 初始反應'];
  rec.support_trace.forEach(x=>out.push((x.level==='L1'||x.level==='L2')?x.level+' 引導':x.level));
  if(rec.mediation)out.push('L3 新資訊');
  if(rec.raw_post!==undefined && rec.raw_post!==null)out.push('POST 介入後反應');
  return out;
}
function scoreBlock(item,rec){
  const i=rec.provisional_initial, p=rec.provisional_post;
  const initialIntent=rec.confirmed_initial, postIntent=rec.confirmed_post;
  let top='';
  if(item!==167){
    top=`<div class="score-row"><span class="score">${i==null?'待檢核':i+'/4'}</span><span class="arrow">→</span><span class="score">${p==null?'待檢核':p+'/4'}</span></div>`;
  }else{
    top=`<div class="score-row"><span class="score">${i==null?'待檢核':i+'/4'}</span></div>`;
  }
  const reason = item===167
    ? (initialIntent?REASONS[item][initialIntent]:'這筆第一次開場保留待人工檢核。')
    : `<b>初始：</b>${initialIntent?REASONS[item][initialIntent]:'待人工檢核。'}<br><b>新資訊後：</b>${postIntent?REASONS[item][postIntent]:'待人工檢核。'}`;
  return `${top}<div class="reason">${reason}</div><div class="trace">${supportLabels(rec).map(x=>'<span>'+escapeHtml(x)+'</span>').join('')}</div>`;
}
function finish(){
  setProgress(100);state.end=now();log('session_end',sessionId,{play_duration_ms:state.end-startedAt});
  const r=$('#results');r.classList.remove('hidden');
  r.innerHTML=`<h1>這次的判斷歷程</h1><div class="lead">以下把「內容表現」和「需要多少支持才推進」分開呈現。支持層級只是歷程紀錄，不解釋成學習潛能高低。</div>
  <div class="result-card"><h3>165｜小組競賽爭議</h3>${scoreBlock(165,state.items[165])}</div>
  <div class="result-card"><h3>166｜後續上課與作業狀況</h3>${scoreBlock(166,state.items[166])}</div>
  <div class="result-card"><h3>167｜與家長開始溝通</h3>${scoreBlock(167,state.items[167])}</div>
  <div class="note">目前分數依 V1 研究原型暫定判準產生；4 分與 1 分受原題高低端策略錨定，中間層級與自動判讀仍需後續專家審查、人工重評與實證驗證。本頁不計算三題總分。167 僅計 INITIAL，後續對話只作溝通歷程紀錄。</div>
  <div class="result-actions"><button class="btn primary" id="exportResult">匯出 JSON</button><button class="btn secondary" id="restartResult">重新體驗</button></div>`;
  $('#exportResult').onclick=exportJson;$('#restartResult').onclick=()=>location.reload();
}
function buildExport(){
  const ex=now(),end=state.end||ex;
  return {meta:{session_id:sessionId,app_version:APP_VERSION,scenario_version:SCENARIO_VERSION,script_version:SCRIPT_VERSION,rubric_version:RUBRIC_VERSION,parser_version:PARSER_VERSION,scoring_rule_version:SCORING_RULE_VERSION,data_schema_version:DATA_SCHEMA_VERSION,ui_version:UI_VERSION,started_at:new Date(startedAt).toISOString(),ended_at:state.end?new Date(state.end).toISOString():null,exported_at:new Date(ex).toISOString()},
  session:{play_duration_ms:end-startedAt,exported_after_end_ms:state.end?ex-state.end:null,first_look:state.firstLook,classroom_recovery:state.classRecovery,colleague_interaction_trace:state.colleagueTrace,communication_trace:state.communication_trace},
  items:state.items,event_log:state.log,self_tests:runSelfTests()};
}
function exportJson(){
  const blob=new Blob([JSON.stringify(buildExport(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sessionId+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),400);log('export_json',sessionId);
}
function runSelfTests(){
  const tests=[
    ['166 dual issue must be 4','那次比賽的事情老師會再跟你處理，但現在上課跟作業是另外一件事，該完成的還是要完成。','separate_issues',4],
    ['166 homework only must be 2','你先把今天的作業完成，等一下再說。','immediate_only',2],
    ['166 explore reason must be 3','你跟老師說看看，為什麼你這麼在意上一次的比賽？','explore_reason',3],
    ['166 support network must be 3','我這邊會繼續跟你談，也會和自然科老師交換一下這幾天看到的情況。','support_network',3],
    ['166 mentions past+current but unclear is not forced 2','我知道你還在想那次比賽，今天作業也還沒完成。',null,null],
    ['165 verify event must be 4','我們問問看其他同學，有沒有人看到是誰先舉手的。','verify_event',4],
    ['165 natural listen must be 3','好，你先說，我聽。','general_listen',3],
    ['165 natural clarification must be 4','你跟老師說說看，剛剛是哪個地方讓你覺得不公平？','clarify_specific',4],
    ['165 casual clarification must be 4','你說的是哪一分？剛剛發生什麼事？','clarify_specific',4],
    ['167 family context must be 3','想請問您最近有注意到子安的情緒，或有聽他回家提到小組比賽嗎？','family_context_inquiry',3]
  ];
  return tests.map(([name,text,intent,sc])=>{const item=name.startsWith('165')?165:name.startsWith('167')?167:166;const p=parse(item,text);return {name,pass:p.pred===intent&&score(item,p.pred)===sc,got_intent:p.pred,got_score:score(item,p.pred)}});
}

$('#soundBtn').onclick=()=>{state.sound=!state.sound;$('#soundBtn').setAttribute('aria-pressed',state.sound);$('#soundBtn').textContent=state.sound?'♫':'♪';if(state.sound)tone(580,.05)};
$('#menuBtn').onclick=()=>$('#menuPop').classList.toggle('hidden');
$('#exportBtn').onclick=exportJson;
$('#restartBtn').onclick=()=>{if(confirm('要重新開始嗎？目前未匯出的作答會清除。'))location.reload()};
document.addEventListener('click',e=>{if(!e.target.closest('#menuBtn')&&!e.target.closest('#menuPop'))$('#menuPop').classList.add('hidden')});

const testResults=runSelfTests();
console.table(testResults);
if(testResults.some(x=>!x.pass)){console.error('Scoring guard failed',testResults);toast('評分自我檢查未通過，請勿用於正式試測');}

start();
})();
</script>
