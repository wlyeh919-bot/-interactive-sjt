function event4(){setSceneMode('classroom');setStage('幾天後，又有新的狀況','五年二班｜數學課','同一週，數日後');setProgress(55);mood('子安','tense','…');say('系統','子安今天沒有交作業。上課時，他又一直跟旁邊同學說話。你提醒過一次，他仍把課本闔起來。','系');sideContent.innerHTML=`<div class="prompt">眼前這節課還在進行，你先怎麼處理？</div><div class="mini-options" id="immediate166"><button data-a="wholeclass">先讓全班繼續做題，稍後再個別處理</button><button data-a="redirect">先提醒子安回到現在的學習活動</button><button data-a="seat">先調整座位</button><button data-a="stopclass">暫停全班活動，現在就處理</button></div>`;$('#immediate166').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.items[166].immediate=b.dataset.a;log('immediate_166',b.dataset.a);mood('子安','upset','!');setSceneMode('closeup');say('子安','我就是不想弄。那次比賽的事情我到現在還是很煩。','安');askText(166,'initial',()=>med166())}))}
function med166(){setSceneMode('closeup');setProgress(64);const r=state.items[166];const medText='我這幾天一看到小組積分就很煩，心裡一直在想那天的事。後來上課也不太想管，作業就一直拖著。';r.mediation={id:'MED166-A',version:'MED166-001',presented_t_ms:elapsed(),text:medText};log('mediation_presented','166',{mediation_id:r.mediation.id,mediation_version:r.mediation.version});say('子安',medText,'安');sideContent.innerHTML=`<div class="prompt">聽完他的補充，你會維持剛才的處理方式，還是想補充或調整？</div><div class="actions"><button id="keep166">維持原做法</button><button class="primary" id="revise166">補充／調整</button></div>`;$('#keep166').addEventListener('click',()=>{r.post_action='keep';r.post_response_provided=false;r.final_intent=r.confirmed_initial??null;r.derived_post_score=r.provisional_initial??null;log('mediation_response','166',{choice:'keep'});event5()});$('#revise166').addEventListener('click',()=>{r.post_action='revise';r.post_response_provided=true;log('mediation_response','166',{choice:'revise'});askText(166,'post',()=>{r.final_intent=r.confirmed_post??null;r.derived_post_score=r.provisional_post??null;event5()})})}
function event5(){transitionScene('下課時間','自然科老師在教室門口叫住你',()=>{setSceneMode('hallway');setStage('科任老師也注意到一些事','教室門口','下課時間');setProgress(73);say('自然科老師','跟你說一下，子安這兩天在我課堂上也比較容易跟旁邊同學起口角，提醒他的時候有點不耐煩。我想說你這邊是不是也有注意到。','科');sideContent.innerHTML=`<div class="prompt">你會怎麼回應科任老師？</div><div class="mini-options" id="colleague"><button data-c="seek">你看到的情況大概是從什麼時候開始的？</button><button data-c="compare">我這邊也有看到一些狀況，我們可以先比對一下這幾天發生的時間和情形。</button><button data-c="joint">我這邊也有類似狀況，我們這幾天都先留意一下。</button><button data-c="ack">好，我知道了。</button></div>`;$('#colleague').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.colleagueTrace=b.dataset.c;log('colleague_trace',b.dataset.c);transitionScene('放學後','教室慢慢安靜下來',event6)}))})}
function event6(){setSceneMode('afterschool');setStage('準備聯絡家長','五年二班｜放學後','放學後');setProgress(82);clearSpeaker();say('系統','教室安靜下來了。你準備聯絡子安家長。桌上有幾項資料，可以先整理一下再打電話。','系');state.parentPrep=[];sideContent.innerHTML=`<div class="prompt">打電話前，你想先看哪些資料？</div><div class="document-grid" id="prep"><button class="doc-card" data-p="incident"><span class="doc-icon">📝</span><span class="doc-title">小組競賽事件</span><span class="doc-sub">當天發生的爭議</span></button><button class="doc-card" data-p="class"><span class="doc-icon">📚</span><span class="doc-title">最近課堂情形</span><span class="doc-sub">這幾天的上課狀況</span></button><button class="doc-card" data-p="homework"><span class="doc-icon">📒</span><span class="doc-title">作業狀況</span><span class="doc-sub">近期繳交情形</span></button><button class="doc-card" data-p="subject"><span class="doc-icon">💬</span><span class="doc-title">科任老師觀察</span><span class="doc-sub">其他課堂看到的情況</span></button></div><div class="actions"><button class="primary" id="callParent">📞 打給家長</button></div><div class="muted" id="prepStatus">你也可以不查看資料，直接聯絡家長。</div>`;$('#prep').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.p;if(!state.parentPrep.includes(p)){state.parentPrep.push(p);log('parent_prep',p);b.disabled=true;b.classList.add('checked');$('#prepStatus').textContent='已整理：'+state.parentPrep.map(x=>({incident:'競賽事件',class:'最近課堂情形',homework:'作業狀況',subject:'科任觀察'}[x])).join('、')}}));$('#callParent').addEventListener('click',()=>transitionScene('電話撥出去了','嘟——嘟——',event7))}
function event7(){setSceneMode('phone');setStage('電話接通了','與子安家長通話','放學後');setProgress(90);clearSpeaker();say('子安家長','老師您好，我是子安的家長。','家');sideContent.innerHTML=`<div class="phone-card"><div class="phone-status">通話中</div><div class="phone-avatar">家</div><div class="phone-name">子安家長</div><div class="phone-wave"><span></span><span></span><span></span><span></span></div></div>`;setTimeout(()=>askText(167,'initial',()=>parentFollowup()),420)}
function parentFollowup(){setSceneMode('phone');setProgress(95);say('子安家長','他這幾天回家確實一直提那次小組比賽，也說自己很在意那個結果。作業我們有提醒，但一提到那件事，他就比較煩。','家');sideContent.innerHTML=`<div class="input-role"><div class="mini-avatar">家</div><div class="role-copy"><strong>子安家長</strong>還在線上</div></div><div class="prompt">聽到家長這樣說，你接下來會怎麼回應？</div><textarea class="textarea" id="repairText" maxlength="800" placeholder="直接輸入你會對家長說的話……"></textarea><div class="actions"><button class="primary" id="submitRepair">回應家長</button></div><div class="muted">這段會保留為親師溝通歷程，不另計第二個 167 分數。</div>`;$('#submitRepair').addEventListener('click',()=>{const t=safeText($('#repairText').value);if(t.length<4){toastMsg('再多說一點點。');return}state.communicationRepair=t;log('parent_repair','167',{length:t.length});if(state.sound)tone(560,.06);transitionScene('這段情境告一段落','看看你一路留下的判斷軌跡',finish)})}
function scoreHtml(item,intent,value,label,parserIntent=null){if(value==null||!intent){const guess=parserIntent&&labels[item]?.[parserIntent]?`<div class="reason">系統初步理解為：「${labels[item][parserIntent]}」，但你未確認這是你的原意，因此不強制給分，保留待人工檢核。</div>`:`<div class="reason">系統目前無法穩定確認你的主要處理意圖，這筆回答已保留，建議後續人工檢核。</div>`;return `<div class="subscore"><strong>${label}</strong><div class="score-line"><span class="score-value">待檢核</span></div>${guess}</div>`;}return `<div class="subscore"><strong>${label}</strong><div class="score-line"><span class="score-value">${value} / 4</span><span class="score-denom">滿分 4 分</span></div><div class="reason">${reasonFor(item,intent)}</div></div>`}
function scoreJourney(item,rec,title){const initial=rec.provisional_initial;const post=rec.provisional_post;const revised=rec.post_action==='revise';let journey='';if(initial!=null&&revised&&post!=null){const cls=post>initial?'score-up':'';journey=`<div class="score-shift"><span class="score-pill">${initial}/4</span><span class="score-arrow">→</span><span class="score-pill ${cls}">${post}/4</span></div>`}return `<div class="result-card"><h4>${title}</h4>${journey}${scoreHtml(item,rec.confirmed_initial,rec.provisional_initial,'初始判斷',rec.parser_initial)}${revised?scoreHtml(item,rec.confirmed_post,rec.provisional_post,'情境資訊後',rec.parser_post):`<div class="muted" style="margin-top:8px">情境資訊後：你選擇維持原處理方式，未另作第二次自由回答。</div>`}</div>`}
function finish(){setSceneMode('results');setStage('這次情境完成','你的判斷歷程','完成');setProgress(100);state.end=now();clearSpeaker();const i165=state.items[165],i166=state.items[166],i167=state.items[167];sceneNote.innerHTML=`<div class="result-card hero-result"><h4>今天的事件告一段落</h4><p>從課堂上的一個計分爭議，到幾天後的學習狀況，再到與家長聯絡，你一路留下了自己的處理軌跡。</p></div>`;sideContent.innerHTML=`<div class="panel-title">這次的判斷軌跡</div>${scoreJourney(165,i165,'小組競賽爭議')}${scoreJourney(166,i166,'後續課堂狀況')}<div class="result-card"><h4>與家長開始溝通</h4>${scoreHtml(167,i167.confirmed_initial,i167.provisional_initial,'切入方式',i167.parser_initial)}</div><div class="prototype-note">目前分數依 V1 研究原型暫定判準產生。4 分與 1 分受原題高低端策略錨定；中間層級與自動判讀仍需後續專家審查、人工重評與實證驗證。本頁不計算三題總分。</div>`;log('session_end',sessionId,{play_duration_ms:state.end-state.start})}
function buildExport(){const exportTime=now();const endTime=state.end||exportTime;return {meta:{session_id:sessionId,app_version:APP_VERSION,scenario_version:SCENARIO_VERSION,script_version:SCRIPT_VERSION,rubric_version:RUBRIC_VERSION,parser_version:PARSER_VERSION,scoring_rule_version:SCORING_RULE_VERSION,data_schema_version:DATA_SCHEMA_VERSION,ui_version:UI_VERSION,started_at:new Date(state.start).toISOString(),ended_at:state.end?new Date(state.end).toISOString():null,exported_at:new Date(exportTime).toISOString()},session:{play_duration_ms:endTime-state.start,exported_after_end_ms:state.end?exportTime-state.end:null,first_action:state.firstAction,classroom_recovery:state.classRecovery,teaching_recovery:state.teachingRecovery,colleague_interaction_trace:state.colleagueTrace,parent_contact_preparation_sequence:state.parentPrep,communication_repair_trace:state.communicationRepair},items:state.items,event_log:state.log}}
function exportJson(){const blob=new Blob([JSON.stringify(buildExport(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${sessionId}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);log('export_json',sessionId)}
function restart(){if(confirm('要重新體驗嗎？目前未匯出的作答會清除。')) location.reload()}
$('#exportBtn').addEventListener('click',exportJson);$('#restartBtn').addEventListener('click',restart);const soundBtn=$('#soundBtn');if(soundBtn)soundBtn.addEventListener('click',()=>{state.sound=!state.sound;soundBtn.setAttribute('aria-pressed',String(state.sound));soundBtn.textContent=state.sound?'🔊':'🔈';toastMsg(state.sound?'提示音已開啟':'提示音已關閉');if(state.sound)tone(580,.06)});
$('#board').addEventListener('click',()=>{log('explore','board');toastMsg('黑板上目前是：12、14、14、13。')});$('#board').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#board').click()}});
document.querySelectorAll('[data-student]').forEach(b=>b.addEventListener('click',()=>{log('explore','student',{name:b.dataset.student});const obs={子安:'子安一直看著黑板上的積分。',宥辰:'宥辰和同組同學還在小聲討論。',佳恩:'佳恩一邊看黑板，一邊等下一題。',品妍:'品妍正在整理桌上的筆和作業本。'};toastMsg(obs[b.dataset.student]||`你注意到${b.dataset.student}。`)}));
start();
})();
